name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Prove every tower can be climbed
        run: npm run verify:levels

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end (two browsers, one server, one match)
        run: npm run e2e

      - name: Build the desktop payload
        run: npm run desktop:payload

      - name: Desktop self test
        run: xvfb-run -a npm run desktop:verify

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          if-no-files-found: ignore
