appId: com.haulmates.game
productName: HAULMATES
copyright: Copyright © 2026
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - renderer/**/*
  - package.json
  # Written by scripts/package-desktop.mjs from HAULMATES_SERVER. Without it a
  # shipped build has no matchmaking server to point at and online play fails
  # against the buyer's own localhost.
  - build-config.json
  - '!**/*.map'
extraMetadata:
  main: dist/main.js
# Steam ships the DRM-free build itself, so no auto-updater is configured.
publish: null
asar: true
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: dir
  icon: build/icon.ico
  artifactName: HAULMATES-win-x64.${ext}
linux:
  # Without this the binary is named after the npm package (@haulmatesdesktop),
  # which is what Steam would end up launching.
  executableName: haulmates
  target:
    - target: dir
  icon: build/icon.png
  category: Game
  artifactName: HAULMATES-linux-x64.${ext}
mac:
  target:
    # Universal, because a Steam customer on Apple silicon and one on an Intel
    # Mac download the same depot and there is nowhere to branch. An x64-only
    # bundle runs under Rosetta at a cost the physics loop can feel.
    - target: dir
      arch:
        - universal
  icon: build/icon.icns
  category: public.app-category.action-games
  artifactName: HAULMATES-mac.${ext}
  # Notarization refuses a bundle that is not hardened, and a hardened Electron
  # app needs the entitlements back. scripts/package-desktop.mjs does the
  # signing and the notarytool round trip.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The bundle is stapled and assessed after notarization, not before it, when
  # Gatekeeper has nothing to assess yet.
  gatekeeperAssess: false
